name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build a signed release AAB (requires signing secrets)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-and-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, debug APK
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tetherloom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html

  release-aab:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    needs: test-and-debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TETHERLOOM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret TETHERLOOM_KEYSTORE_BASE64 is missing. See docs/RELEASE.md." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release AAB
        env:
          TETHERLOOM_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          TETHERLOOM_KEYSTORE_PASSWORD: ${{ secrets.TETHERLOOM_KEYSTORE_PASSWORD }}
          TETHERLOOM_KEY_ALIAS: ${{ secrets.TETHERLOOM_KEY_ALIAS }}
          TETHERLOOM_KEY_PASSWORD: ${{ secrets.TETHERLOOM_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload release AAB and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: tetherloom-release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
